<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <rect width="1200" height="850" fill="white"/>
  <g fill="none" stroke="black" stroke-width="3">
    <!-- cube -->
    <path d="M150 250 L760 250 L1040 95 L430 95 Z"/>
    <path d="M150 250 L150 700 L760 700 L760 250"/>
    <path d="M760 250 L1040 95 L1040 545 L760 700"/>
    <path d="M430 95 L430 545" stroke-dasharray="10 10"/>
    <path d="M430 545 L150 700" stroke-dasharray="10 10"/>
    <path d="M430 545 L1040 545" stroke-dasharray="10 10"/>

    <!-- coordinate axes from deep corner -->
    <path d="M430 545 L250 645" marker-end="url(#arrow)"/>
    <path d="M430 545 L650 545" marker-end="url(#arrow)"/>
    <path d="M430 545 L430 20" marker-end="url(#arrow)"/>

    <!-- rod A1, projected length ~ half cube edge -->
    <g transform="rotate(48 570 310)">
      <rect x="430" y="275" width="300" height="70" rx="35"/>
      <line x1="430" y1="310" x2="730" y2="310" stroke-dasharray="9 9"/>
    </g>

    <!-- rod A2 -->
    <g transform="rotate(35 720 520)">
      <rect x="570" y="485" width="300" height="70" rx="35"/>
      <line x1="570" y1="520" x2="870" y2="520" stroke-dasharray="9 9"/>
    </g>

    <!-- shortest segment -->
    <circle cx="665" cy="410" r="7" fill="black"/>
    <circle cx="715" cy="465" r="7" fill="black"/>
    <line x1="665" y1="410" x2="715" y2="465" stroke-width="5"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="black"/>
    </marker>
  </defs>

  <g font-family="Times New Roman, serif" font-size="34" fill="black" font-style="italic">
    <text x="220" y="675">x</text>
    <text x="660" y="555">y</text>
    <text x="445" y="45">z</text>
    <text x="400" y="575">O</text>
    <text x="500" y="335">K<tspan baseline-shift="sub" font-size="24">A1</tspan></text>
    <text x="820" y="555">K<tspan baseline-shift="sub" font-size="24">A2</tspan></text>
    <text x="630" y="405">P*</text>
    <text x="720" y="490">Q*</text>
    <text x="690" y="430">d<tspan baseline-shift="sub" font-size="24">min</tspan></text>
    <text x="195" y="365">x = 0</text>
    <text x="900" y="365">x = L</text>
  </g>
</svg>
